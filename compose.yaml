# Runs the queue setup locally: RabbitMQ, the web server, and a measurement worker.
#
# One-time setup on the host:
#   1. Log in to Google Cloud:   gcloud auth application-default login
#   2. Create your settings:     copy .env.example to .env and set GOOGLE_CLOUD_PROJECT
#
# Start:    docker compose up --build        then open http://localhost:8000
# Stop:     Ctrl+C, or `docker compose down` if started with -d
# More workers:   docker compose up --build --scale worker=3
# RabbitMQ dashboard:   http://localhost:15673  (guest / guest)
#
# Optional overrides (shell environment or .env):
#   WEB_PORT      host port for the web server (default 8000)
#   RESULTS_DIR   host folder for uploads and results (default ./results)
#   GCLOUD_ADC    path to the Google login file, if it isn't in the default place
#
# Products (Superbalist catalogue): the products API on http://localhost:8001 and the Cloud SQL Auth
# Proxy it reads the database through. Off unless the "products" profile is on, so `docker compose up`
# works for people without access to the database. To include them:
#   docker compose --profile products up --build
# or set COMPOSE_PROFILES=products in .env to make it the default. Needs CLOUD_SQL_INSTANCE and
# DATABASE_URL in .env (see .env.example).

x-app: &app
  build: .
  image: tryon
  env_file: .env
  environment:
    # Not QUEUE_BACKEND from .env, so the same .env still works when running without Docker.
    # RabbitMQ unless DOCKER_QUEUE_BACKEND=pubsub (in .env or the shell) uses the real Pub/Sub topics
    QUEUE_BACKEND: ${DOCKER_QUEUE_BACKEND:-rabbitmq}
    RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/   # "rabbitmq" = the service below
    GOOGLE_APPLICATION_CREDENTIALS: /gcloud/adc.json   # your Google login, mounted below (not set in the image)
  volumes:
    # Windows keeps the login file under %APPDATA%; macOS/Linux under ~/.config
    - ${GCLOUD_ADC:-${APPDATA:-~/.config}/gcloud/application_default_credentials.json}:/gcloud/adc.json:ro
    # Shared by web and worker: the web server saves the photos, the worker reads them
    - ${RESULTS_DIR:-./results}:/app/results
  depends_on:
    rabbitmq:
      condition: service_healthy   # wait until RabbitMQ accepts connections, not just started

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq   # RabbitMQ keys its stored data on the hostname; keep it fixed
    ports:
      # Not 5672/15672, so this never clashes with another project's broker on the host
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq   # queued jobs survive restarts
    healthcheck:
      # Passes once RabbitMQ accepts client connections. (`ping` passes a few seconds earlier,
      # when the node is up but not yet listening, so web and worker would start too soon.)
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  web:
    <<: *app
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["python", "worker.py"]

  # ── Products (profile "products") ───────────────────────────────────────────

  # Makes the Cloud SQL database appear on localhost:5432, logged in with the same Google login as the app
  cloudsql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
    profiles: ["products"]
    restart: unless-stopped
    # DB_PROXY_PORT (default 5432) if something else on this computer already uses 5432, such as a local
    # PostgreSQL. The proxy listens on the same port inside Docker as outside, so DATABASE_URL's port
    # (set it to match) works for both the products API here and the sync script run outside Docker.
    command: ["--address", "0.0.0.0", "--port", "${DB_PROXY_PORT:-5432}", "--credentials-file", "/gcloud/adc.json",
              "${CLOUD_SQL_INSTANCE:-}"]   # the instance's connection name, e.g. project:region:instance
    ports:
      # The database, for psql or the sync script run outside Docker. Only this computer can connect.
      - "127.0.0.1:${DB_PROXY_PORT:-5432}:${DB_PROXY_PORT:-5432}"
    volumes:
      - ${GCLOUD_ADC:-${APPDATA:-~/.config}/gcloud/application_default_credentials.json}:/gcloud/adc.json:ro

  products-api:
    build: ./superbalist
    image: tryon-products
    profiles: ["products"]
    restart: unless-stopped
    env_file: .env
    environment:
      # DATABASE_URL in .env says localhost:5432 (right outside Docker); in here the proxy is this service
      DATABASE_HOST: cloudsql-proxy
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - cloudsql-proxy

volumes:
  rabbitmq-data:
