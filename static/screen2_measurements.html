<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tailor — Your Measurements</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 40px 20px; background: #f5f5f7; color: #1d1d1f;
            min-height: 100vh;
        }
        .container {
            max-width: 900px; margin: 0 auto; background: white;
            border-radius: 18px; padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .subtitle { color: #6e6e73; margin: 0 0 24px; font-size: 15px; }

        .summary {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            margin-bottom: 32px;
        }
        .summary-item {
            padding: 14px 16px; background: #f5f5f7; border-radius: 12px;
        }
        .summary-item .label {
            font-size: 11px; color: #6e6e73; text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 4px;
        }
        .summary-item .value {
            font-size: 20px; font-weight: 600; color: #1d1d1f;
        }

        .section-title {
            font-weight: 600; font-size: 14px; color: #6e6e73;
            text-transform: uppercase; letter-spacing: 0.5px;
            margin: 24px 0 12px;
        }
        .measurements-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
        }
        .measure-row {
            display: flex; justify-content: space-between; padding: 12px 16px;
            background: #fafafa; border-radius: 10px; font-size: 14px;
        }
        .measure-row .name { color: #1d1d1f; }
        .measure-row .value { color: #0071e3; font-weight: 600; text-align: right; }

        .warnings {
            background: #fff8e6; color: #b25000; padding: 12px 16px;
            border-radius: 10px; margin-bottom: 24px; font-size: 13px; display: none;
        }
        .warnings ul { margin: 4px 0 0 20px; padding: 0; }

        .actions { display: flex; gap: 12px; margin-top: 32px; }
        .btn {
            flex: 1; padding: 14px 20px; border-radius: 12px;
            font-size: 16px; font-weight: 600; text-decoration: none;
            text-align: center; cursor: pointer; border: none; font-family: inherit;
            transition: all 0.2s;
        }
        .btn-primary { background: #0071e3; color: white; }
        .btn-primary:hover { background: #0077ed; }
        .btn-secondary { background: #f5f5f7; color: #1d1d1f; }
        .btn-secondary:hover { background: #ebebed; }

        .loading { text-align: center; padding: 60px 0; color: #6e6e73; }

        @media (max-width: 700px) {
            .summary { grid-template-columns: repeat(2, 1fr); }
            .measurements-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Measurements</h1>
        <p class="subtitle">Estimated by AI from your photos and details. Treat them as close estimates, not tailor measurements.</p>
        <div id="content"><div class="loading">Loading measurements…</div></div>
    </div>

    <script>
        // ── Formatting helpers ──
        function heightFmt(cm) {
            const totalIn = cm / 2.54;
            const ft = Math.floor(totalIn / 12);
            const inches = Math.round(totalIn - ft * 12);
            return `${ft}′${inches}″`;
        }
        function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
        const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

        // measurement.json key -> display label, in display order
        const MEASURE_LABELS = {
            neck_circ:        'Neck Circumference',
            shoulder_breadth: 'Shoulder Breadth',
            bust_chest_circ:  'Bust / Chest',
            waist_circ:       'Waist Circumference',
            hip_circ:         'Hip Circumference',
            thigh_circ:       'Thigh Circumference',
            calf_circ:        'Calf Circumference',
            bicep_circ:       'Bicep Circumference',
            forearm_circ:     'Forearm Circumference',
            wrist_circ:       'Wrist Circumference',
            ankle_circ:       'Ankle Circumference',
            upper_arm_length: 'Upper Arm Length',
            lower_arm_length: 'Lower Arm Length',
            upper_leg_length: 'Upper Leg Length',
            lower_leg_length: 'Lower Leg Length',
            nape_to_waist:    'Nape to Waist Distance',
        };

        const jobId = new URLSearchParams(location.search).get('job');

        async function load() {
            const content = document.getElementById('content');
            if (!jobId) {
                content.innerHTML = `<div class="loading">No measurement session found. <a href="/">Upload your photos</a> to start.</div>`;
                return;
            }
            try {
                const res = await fetch(`/measurements_data/${encodeURIComponent(jobId)}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || `Request failed (${res.status}).`);
                render(data);
            } catch (err) {
                content.innerHTML = `<div class="loading">Could not load measurements: ${esc(err.message)}</div>`;
            }
        }

        function render(data) {
            const inp = data.inputs;
            const shape = data.body_shape;
            const cm = data.measurements_cm;

            // Summary cards
            const summary = `
                <div class="summary">
                    <div class="summary-item">
                        <div class="label">Height</div>
                        <div class="value">${heightFmt(inp.height_cm)}</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">Weight</div>
                        <div class="value">${Math.round(inp.weight_kg)} kg</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">Gender</div>
                        <div class="value">${esc(capitalize(inp.gender))}</div>
                    </div>
                    <div class="summary-item">
                        <div class="label">Age</div>
                        <div class="value">${Math.round(inp.age)} yrs</div>
                    </div>
                </div>
            `;

            const row = (name, value) => `
                <div class="measure-row">
                    <span class="name">${name}</span>
                    <span class="value">${value}</span>
                </div>
            `;
            const shapeRows = [
                row('Build', esc(shape.build)),
                row('Proportions', `${shape.torso_percent}% torso · ${100 - shape.torso_percent}% legs`),
            ].join('');
            const measureRows = Object.entries(MEASURE_LABELS)
                .filter(([key]) => key in cm)
                .map(([key, label]) => row(label, `${Number(cm[key]).toFixed(1)} cm`))
                .join('');

            // Model's notes on what made estimates less reliable (the model writes these, so escape them)
            const warnings = data.warnings && data.warnings.length ? `
                <div class="warnings" style="display:block">
                    <strong>Less certain estimates</strong>
                    <ul>${data.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
                </div>` : '';

            document.getElementById('content').innerHTML = `
                ${summary}
                ${warnings}
                <div class="section-title">Body Shape</div>
                <div class="measurements-grid">${shapeRows}</div>
                <div class="section-title">Detailed Measurements</div>
                <div class="measurements-grid">${measureRows}</div>
                <div class="actions">
                    <a href="/" class="btn btn-secondary">Upload Again</a>
                    <a href="/tryon?job=${encodeURIComponent(jobId)}" class="btn btn-primary">Continue to try-on</a>
                </div>
            `;
        }

        load();
    </script>
</body>
</html>
